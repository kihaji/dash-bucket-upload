site_name: dash-bucket-upload
site_description: Large-file uploads for Plotly Dash, stored in any S3-compatible bucket.
site_url: https://kihaji.github.io/dash-bucket-upload/
repo_url: https://github.com/kihaji/dash-bucket-upload
repo_name: kihaji/dash-bucket-upload
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Choosing a transport: guide/transports.md
      - S3-compatible stores: guide/stores.md
      - Callbacks and outputs: guide/callbacks.md
      - Multiple widgets and limits: guide/multiple-widgets.md
      - Production deployment: guide/production.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Python API: reference/python.md
      - Component props: reference/component-props.md
      - HTTP routes: reference/http-api.md
      - How it works: reference/how-it-works.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2

watch:
  - dash_bucket_upload

validation:
  links:
    anchors: warn
