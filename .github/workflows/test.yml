name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        dash-version: ['3.4.0', '4.3.0']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies  # npm ci fails on a stale package-lock.json
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Build JavaScript bundle
        run: npm run build:js

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify uv.lock is current
        run: uv lock --check

      - name: Install Python dependencies  # bundle already built above, skip the hook
        env:
          DASH_BUCKET_UPLOAD_SKIP_JS_BUILD: '1'
        run: |
          uv sync
          uv pip install "dash[testing]==${{ matrix.dash-version }}"
          # dash 4.x [testing] pulls percy-python-selenium, whose top-level `percy` module
          # clobbers percy 2.0.2's; dash.testing.browser needs percy.Runner from the latter
          uv pip install --reinstall percy==2.0.2

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run Pyright type checker
        run: uv run npx pyright

      - name: Run Python tests with coverage
        run: uv run pytest tests/ -v --cov=dash_bucket_upload --cov-report=term-missing

      - name: Run browser integration smoke test
        env:
          BUCKET_UPLOAD_BROWSER_TESTS: '1'
        run: uv run pytest tests/test_integration_smoke.py --headless -v

  # The moto-based suite again, but against a real MinIO service container
  minio-integration:
    runs-on: ubuntu-latest
    services:
      minio:
        # bitnami/minio is gone from Docker Hub; minio/minio needs an account
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build JavaScript bundle
        run: |
          npm ci
          npm run build:js

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        env:
          DASH_BUCKET_UPLOAD_SKIP_JS_BUILD: '1'
        run: uv sync

      - name: Run test suite against MinIO
        env:
          BUCKET_UPLOAD_S3_ENDPOINT: http://localhost:9000
          BUCKET_UPLOAD_S3_ACCESS_KEY: minioadmin
          BUCKET_UPLOAD_S3_SECRET_KEY: minioadmin
        run: uv run pytest tests/ -v

  # Build the wheel once per PR — uv build runs the JS build via the hatch hook
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build Python package (self-building wheel)
        run: uv build

      - name: Verify package with twine
        run: uvx twine check dist/*

  # Strict docs build (broken links, bad docstrings) so release-time publishing can't fail
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build docs
        run: |
          uv run --only-group docs python scripts/check_docs_api.py
          uv run --only-group docs mkdocs build --strict
