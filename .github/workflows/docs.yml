name: Publish docs

on:
  push:
    tags:
      # Same release tags as publish.yml (v0.1.0), not pre-releases (v0.1.0-rc1)
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual re-publish (e.g. a docs-only fix between releases)
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # mkdocstrings reads the Python sources statically, so only the docs
      # group is installed: no project install, no npm/JS bundle build.
      - name: Build site
        run: |
          uv run --only-group docs python scripts/check_docs_api.py
          uv run --only-group docs mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
