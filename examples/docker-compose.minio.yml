# Local S3-compatible dev environment for the examples.
#
#   docker compose -f examples/docker-compose.minio.yml up -d
#
# Console at http://localhost:9001 (minioadmin / minioadmin).
# The init container creates the buckets, applies CORS (direct mode needs the
# ETag header exposed to the browser), and adds a lifecycle rule that aborts
# incomplete multipart uploads after 1 day (cleans up after closed browsers).
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-init:/init:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/uploads local/media
        mc ilm import local/uploads < /init/lifecycle.json
        mc ilm import local/media < /init/lifecycle.json
        mc cors set local/uploads /init/cors.xml
        mc cors set local/media /init/cors.xml
        echo "MinIO initialized"

volumes:
  minio-data:
